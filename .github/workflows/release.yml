name: Release

on:
  push:
    tags:
      - "v*"

permissions: {}

jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Unit tests
        run: go test -count=1 ./...

  vet:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Vet
        run: go vet ./...

  race:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Race tests
        run: go test -count=1 -race ./...

  static-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build, inspect, and package static Linux binaries
        run: bash scripts/package-release.sh

      - name: Upload verified release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-dist
          path: dist/
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      AWS_REGION: us-east-1
      EZDBBACKUP_TEST_S3_ENDPOINT: http://127.0.0.1:4566
      COMPOSE_PROJECT_NAME: ezdbbackup-release-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Docker versions
        run: |
          docker version
          docker compose version
      - name: Start LocalStack
        run: docker compose -f test/compose.yml up -d --wait --wait-timeout 120
      - name: Tagged LocalStack integration suite
        run: go test -count=1 -tags=integration ./test/e2e -v
      - name: Stop LocalStack
        if: always()
        run: docker compose -f test/compose.yml down -v --remove-orphans

  publish:
    needs:
      - unit
      - vet
      - race
      - static-build
      - integration
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download verified release artifacts
        uses: actions/download-artifact@v4
        with:
          name: release-dist
          path: dist
      - name: Verify packaged checksums
        run: cd dist && sha256sum -c SHA256SUMS
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --verify-tag --generate-notes

  apt-publish:
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download verified release artifacts
        uses: actions/download-artifact@v4
        with:
          name: release-dist
          path: dist
      - name: Verify packaged checksums
        run: cd dist && sha256sum -c SHA256SUMS
      - name: Resolve Debian package paths
        id: packages
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          [[ "${version}" =~ ^[0-9A-Za-z][0-9A-Za-z._-]*$ ]]
          amd64="dist/ezdbbackup_${version}_amd64.deb"
          arm64="dist/ezdbbackup_${version}_arm64.deb"
          [[ -f "${amd64}" && ! -L "${amd64}" ]]
          [[ -f "${arm64}" && ! -L "${arm64}" ]]
          {
            echo 'files<<EZDBBACKUP_PACKAGES'
            printf '%s\n' "${amd64}" "${arm64}"
            echo 'EZDBBACKUP_PACKAGES'
          } >>"${GITHUB_OUTPUT}"
      - name: Publish Debian packages to the EZ Game Host APT repository
        uses: ezgamehost/apt-repo-infra/.github/actions/publish@8c24b79cdad7db0acf6f321d31aae831e4130196
        with:
          release-tag: ${{ github.ref_name }}
          package-files: ${{ steps.packages.outputs.files }}
          github-token: ${{ github.token }}
          infra-token: ${{ secrets.APT_REPOSITORY_DISPATCH_TOKEN }}
